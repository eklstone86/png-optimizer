[package]
name = "png_optimizer"
version = "1.0.0"
edition = "2024"
authors = ["Alexander <alex@elvista.net>"]
description = "Fast batch PNG optimizer for Windows: palette reduction with a transparency guarantee plus lossless recompression"
license = "GPL-3.0-or-later"
readme = "README.md"

[[bin]]
name = "PNGOptimizer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "persistence", "accesskit"] }
egui-elegance = "0.16.0"
egui_extras = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "tga", "ico", "qoi"] }
imagequant = "4.4.1"
lodepng = "3.12.2"
oxipng = { version = "10.2.1", default-features = false, features = ["parallel", "zopfli"] }
raw-window-handle = "0.6"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
